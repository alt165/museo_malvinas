services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: museo
      POSTGRES_USER: museo
      POSTGRES_PASSWORD: museo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/museo
      SPRING_DATASOURCE_USERNAME: museo
      SPRING_DATASOURCE_PASSWORD: museo
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/museo
    depends_on:
      - database
    ports:
      - "8080:8080"

volumes:
  postgres_data:
