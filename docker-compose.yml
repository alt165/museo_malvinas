services:
  postgres:
    image: postgres:16
    container_name: museo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-museo}
      POSTGRES_USER: ${POSTGRES_USER:-museo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museo -d museo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - museo_network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: museo-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_HOSTNAME_ADMIN:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./backend/docker/keycloak:/opt/keycloak/data/import:ro
    networks:
      - museo_network

  backend:
    container_name: museo-backend
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-museo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-museo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-museo}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/museo}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/museo/protocol/openid-connect/certs}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-museo-backend}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - museo_network

volumes:
  postgres_data:

networks:
  museo_network:
    driver: bridge
