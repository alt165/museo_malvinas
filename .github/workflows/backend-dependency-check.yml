name: Backend dependency check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/cache@v4
        with:
          path: dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-
      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: test -n "$NVD_API_KEY"
      - name: Scan backend dependencies (fail at CVSS 7.0)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./ops/dependency-check.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn

