spring:
  application:
    name: museo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/museo}
    username: ${SPRING_DATASOURCE_USERNAME:museo}
    password: ${SPRING_DATASOURCE_PASSWORD:museo}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/museo}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/museo/protocol/openid-connect/certs}

app:
  security:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:museo-backend}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.proveedores: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level logger=%logger{36} thread=%thread requestId=%X{requestId:-} user=%X{user:-anonymous} method=%X{httpMethod:-} endpoint=%X{endpoint:-} status=%X{httpStatus:-} message=%replace(%msg){'[^A-Za-z0-9_.=:/,-]+','_'}%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false
