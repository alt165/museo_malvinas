spring:
  application:
    name: museo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/museo}
    username: ${SPRING_DATASOURCE_USERNAME:museo}
    password: ${SPRING_DATASOURCE_PASSWORD:museo}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/museo}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/museo/protocol/openid-connect/certs}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  keycloak:
    admin:
      server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_ADMIN_REALM:museo}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:museo-admin}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:museo-admin-secret}
  security:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:museo-backend}
  storage:
    object-files-dir: ${APP_STORAGE_OBJECT_FILES_DIR:${APP_STORAGE_OBJECT_PHOTOS_DIR:./storage/object-files}}
    object-photos-dir: ${APP_STORAGE_OBJECT_PHOTOS_DIR:./storage/object-photos}
    signed-receipts-dir: ${APP_STORAGE_SIGNED_RECEIPTS_DIR:./storage/signed-receipts}
  upload:
    max-photo-size-mb: ${APP_UPLOAD_MAX_PHOTO_SIZE_MB:5}
    max-receipt-size-mb: ${APP_UPLOAD_MAX_RECEIPT_SIZE_MB:10}
    max-signed-receipt-size-mb: ${APP_UPLOAD_MAX_SIGNED_RECEIPT_SIZE_MB:10}
  images:
    public-version:
      max-size: ${APP_IMAGES_PUBLIC_MAX_SIZE:1600}
      cache-max-age-seconds: ${APP_IMAGES_PUBLIC_CACHE_MAX_AGE_SECONDS:86400}
    watermark:
      opacity: ${APP_IMAGES_WATERMARK_OPACITY:0.22}
      relative-width: ${APP_IMAGES_WATERMARK_RELATIVE_WIDTH:0.18}
      horizontal-gap: ${APP_IMAGES_WATERMARK_HORIZONTAL_GAP:0.35}
      vertical-gap: ${APP_IMAGES_WATERMARK_VERTICAL_GAP:0.45}
      resource: ${APP_IMAGES_WATERMARK_RESOURCE:classpath:/watermark/logo-header.png}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: INFO
    com.proveedores: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level logger=%logger{36} thread=%thread requestId=%X{requestId:-} user=%X{user:-anonymous} method=%X{httpMethod:-} endpoint=%X{endpoint:-} status=%X{httpStatus:-} message=%replace(%msg){'[^A-Za-z0-9_.=:/,-]+','_'}%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false
